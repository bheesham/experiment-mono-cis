[project]
name = "mono-cis"
version = "0.1.0"
description = "CIS, as a monorepo."
readme = "README.md"
authors = [
    { name = "Bheesham Persaud", email = "bhee@mozilla.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.92",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
]

[project.scripts]
mono-cis = "mono_cis:main"
# One entrypoint per project sharing this codebase.
publisher-ldap = "mono_cis.publishers.ldap:cli"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Tests are stdlib unittest.TestCase, runnable with either
# `python -m unittest discover -s tests -t .` or `pytest`.
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
